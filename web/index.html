<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Transit: Mumbai locals and metro. Next-train countdowns, offline timetables and a schedule-based train map. A Flutter app.">
  <meta name="theme-color" content="#3b0d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transit">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Transit · Mumbai locals and metro</title>
  <style>
    html, body { margin: 0; height: 100%; background: #3b0d17; }
    /* Shown while the engine loads, then handed to the app's own splash,
       which opens on the same colour and draws the same line. */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .35s ease; }
    #boot svg { width: 64px; height: 64px; }
    #boot path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s cubic-bezier(.65,0,.35,1) infinite alternate; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot path { animation: none; stroke-dashoffset: 0; } }
    body.ready #boot { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <path pathLength="100" d="M10 70 H44 L70 36 H90" fill="none" stroke="#efd9b0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('ready');
      setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
